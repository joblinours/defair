# DEFAIR configuration
# See src/defair/config.py for all options and defaults.

storage:
  database: ~/.defair/defair.db
  evidence: /evidence
  cases: ~/.defair/cases

logging:
  level: INFO
  format: console    # "json" or "console"

mcp:
  allow_exec: false  # arbitrary shell via MCP — keep off, agents use run_tool

container:
  # Host directories evidence may be mounted from (required for MCP).
  evidence_roots:
    - ./evidence
  allowed_image_prefixes:
    - ghcr.io/joblinours/defair
  network: none
  mem_limit: 8g
  cpus: 4
  pids_limit: 2048
  read_only_rootfs: true

extraction:             # archive-bomb guards for ZIP / 7z / image carving
  max_bytes: 214748364800   # 200 GiB
  max_files: 1000000

orchestrator:
  max_parallel: 4         # profile steps run concurrently
  default_timeout: 7200   # seconds per step
  default_retries: 0

timezone: UTC
