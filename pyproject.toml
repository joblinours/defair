[project]
name = "defair"
version = "0.2.0"
description = "DEFAIR — Digital Forensics & Incident Response platform. MCP-first, containerized, modular."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Lucas Joblin", email = "lucas.joblin@gmail.com" },
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.11",
    "structlog>=25.4",
    "aiosqlite>=0.21",
    "rich>=14.0",
    "fastmcp>=2.13",
    "pyyaml>=6.0",
    "docker>=7.1",
]

[project.optional-dependencies]
forensic = [
    "dissect>=3.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
defair = "defair.cli.main:cli"
defair-mcp = "defair.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defair"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/defair/normalizers/*" = ["BLE001"]
"src/defair/tools/base.py" = ["BLE001"]
