description: >
  Extended Windows analysis — everything in windows-triage plus Jump Lists,
  Recycle Bin, ShellBags, SRUM, Windows Timeline, browser databases, USN
  journal, and a broad YARA/Sigma scan (every pinned rule source).
platforms: [windows]
steps:
  - id: evtx
    tool: evtxecmd
    input: evtx_dir
    fallbacks: [evtx_native, {tool: dissect_plugin, plugin: evtx, input: target}]
  - id: hunt
    action: hunt
    input: evtx_dir
    optional: true
  - id: hunt_chainsaw
    action: hunt
    input: evtx_dir
    options: {engine: chainsaw, rule_profile: broad}
    optional: true
    description: second Sigma engine on the pinned store (cross-check)
  - id: prefetch
    tool: prefetch
    input: prefetch_dir
    fallbacks: [{tool: dissect_plugin, plugin: prefetch, input: target}]
  - id: amcache
    tool: amcacheparser
    input: amcache
    fallbacks: [{tool: dissect_plugin, plugin: amcache.applications, input: target}]
  - id: shimcache
    tool: appcompatcacheparser
    input: system_hive
    fallbacks: [{tool: dissect_plugin, plugin: shimcache, input: target}]
  - id: hives_replay
    tool: rla
    input: hives_dir
    optional: true
    description: apply .LOG1/.LOG2 to dirty hives (clean copies in the workspace)
  - id: registry
    tool: recmd
    input: step:hives_replay
    input_fallback: hives_dir
    needs: [hives_replay]
    fallbacks: [{tool: dissect_plugin, plugin: runkeys, input: target}]
  - id: recentfilecache
    tool: recentfilecacheparser
    input: recentfilecache
    fallbacks: [{tool: dissect_plugin, plugin: recentfilecache, input: target}]
  - id: userassist
    tool: dissect_plugin
    input: target
    options: {plugin: userassist}
    optional: true
  - id: lnk
    tool: lecmd
    input: users_dir
    fallbacks: [lnk_native, {tool: dissect_plugin, plugin: lnk, input: target}]
  - id: jumplists
    tool: jlecmd
    input: users_dir
    fallbacks: [{tool: dissect_plugin, plugin: jumplist.automatic_destination, input: target}]
  - id: shellbags
    tool: sbecmd
    input: users_dir
    fallbacks: [{tool: dissect_plugin, plugin: shellbags, input: target}]
  - id: recyclebin
    tool: rbcmd
    input: recyclebin
    fallbacks: [{tool: dissect_plugin, plugin: recyclebin, input: target}]
  - id: srum
    tool: srumecmd
    input: srum
    options: {registry_hive: $software_hive}
  - id: wintimeline
    tool: wxtcmd
    input: activities
    fallbacks: [{tool: dissect_plugin, plugin: activitiescache, input: target}]
  - id: browsers
    tool: sqlecmd
    input: users_dir
    fallbacks: [{tool: dissect_plugin, plugin: browser.history, input: target}]
  - id: mft
    tool: mftecmd
    input: mft
    fallbacks: [{tool: dissect_plugin, plugin: mft.records, input: target}]
  - id: usnjrnl
    tool: mftecmd
    input: usnjrnl
    options: {mft_path: $mft}
    fallbacks: [{tool: dissect_plugin, plugin: usnjrnl, input: target}]
  - id: logfile
    tool: logfile_native
    input: logfile
  - id: indx_slack
    tool: indx_native
    input: target
    optional: true
    description: deleted / renamed file names carved from $I30 slack (disk images)
  - id: ual
    tool: sumecmd
    input: sum_dir
    fallbacks: [{tool: dissect_plugin, plugin: ual.client_access, input: target}]
  - id: tasks
    tool: tasks_native
    input: tasks_dir
    fallbacks: [{tool: dissect_plugin, plugin: tasks, input: target}]
  - id: psreadline
    tool: psreadline_native
    input: users_dir
    fallbacks: [{tool: dissect_plugin, plugin: powershell_history, input: target}]
  - id: mplog
    tool: mplog_native
    input: mplog_dir
    fallbacks: [{tool: dissect_plugin, plugin: defender.mplog, input: target}]
  - id: webcache
    tool: webcache_native
    input: users_dir
    fallbacks: [{tool: dissect_plugin, plugin: iexplore.history, input: target}]
  - id: rdpcache
    tool: rdpcache_native
    input: users_dir
    optional: true
  - id: iis
    tool: iis_native
    input: iis_logs
    fallbacks: [{tool: dissect_plugin, plugin: iis.access, input: target}]
  - id: scan
    action: scan
    input: base
    options: {mode: all, rule_profile: broad}
    optional: true
  - id: strings
    tool: strings_native
    input: target
    optional: true
    description: strings of pagefile.sys / swapfile.sys for watchlist search
  - id: host_profile
    action: host_profile
    needs: [registry, evtx]
    optional: true
  - id: timeline
    action: timeline_summary
    needs: [evtx, hunt, hunt_chainsaw, prefetch, amcache, shimcache, registry, recentfilecache, userassist, lnk,
            jumplists, shellbags, recyclebin, srum, wintimeline, browsers, mft, usnjrnl, logfile, indx_slack, ual,
            tasks, psreadline, mplog, webcache, rdpcache, iis, strings, host_profile, scan]
