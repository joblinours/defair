description: >
  Fast Windows triage — event logs + Sigma hunting, execution evidence
  (Prefetch, Amcache, Shimcache), registry, LNK, MFT, and a precise YARA/Sigma
  scan. EZ Tools first; pure-Python and Dissect plugins as fallbacks.
platforms: [windows]
steps:
  - id: evtx
    tool: evtxecmd
    input: evtx_dir
    fallbacks: [evtx_native, {tool: dissect_plugin, plugin: evtx, input: target}]
  - id: hunt
    action: hunt
    input: evtx_dir
    optional: true
  - id: prefetch
    tool: prefetch
    input: prefetch_dir
    fallbacks: [{tool: dissect_plugin, plugin: prefetch, input: target}]
  - id: amcache
    tool: amcacheparser
    input: amcache
    fallbacks: [{tool: dissect_plugin, plugin: amcache.applications, input: target}]
  - id: shimcache
    tool: appcompatcacheparser
    input: system_hive
    fallbacks: [{tool: dissect_plugin, plugin: shimcache, input: target}]
  - id: registry
    tool: recmd
    input: hives_dir
    fallbacks: [{tool: dissect_plugin, plugin: runkeys, input: target}]
  - id: lnk
    tool: lecmd
    input: users_dir
    fallbacks: [lnk_native, {tool: dissect_plugin, plugin: lnk, input: target}]
  - id: mft
    tool: mftecmd
    input: mft
    fallbacks: [{tool: dissect_plugin, plugin: mft.records, input: target}]
  - id: scan
    action: scan
    input: base
    options: {mode: all, rule_profile: precise}
    optional: true
  - id: timeline
    action: timeline_summary
    needs: [evtx, hunt, prefetch, amcache, shimcache, registry, lnk, mft, scan]
